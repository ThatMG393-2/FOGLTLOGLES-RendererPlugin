name: Build Plugin
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - 'scripts/**'
      - '.vscode/*'
      - '.devcontainer*/*'
  workflow_run:
    workflows: ["Update FOGLTLOGLES"]
    types:
      - completed

jobs:
  build:
    permissions:
      id-token: write
    
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Validate GradleW
        uses: gradle/actions/wrapper-validation@v4

      - name: Check prebuilt libs are present
        run: |
          test -n "$(ls app/src/main/jniLibs/arm64-v8a/*.so 2>/dev/null)" || { echo "Run the 'Update FOGLTLOGLES' workflow first"; exit 1; }
          test -n "$(ls app/src/main/jniLibs/armeabi-v7a/*.so 2>/dev/null)" || { echo "Run the 'Update FOGLTLOGLES' workflow first"; exit 1; }

      - name: Build
        run: bash gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FOGLTLOGLES-RendererPlugin Build
          path: app/build/outputs/apk/*/*.apk

